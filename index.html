<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101d3c"><title>BLOCKTOPIA — Skyway Obby</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101d3c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f7fbff;touch-action:none}button{font:inherit;color:inherit}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.topbar{position:fixed;top:max(18px,env(safe-area-inset-top));left:22px;right:22px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:12px}.brand,.stats{pointer-events:auto}.brand{display:flex;align-items:center;gap:11px;text-shadow:0 2px 12px #16345f}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,#8af0ff,#3288ff);box-shadow:0 7px 22px #1886d966;font-size:23px;border:1px solid #ffffff72}.brand-name{font-weight:1000;font-size:19px;letter-spacing:1.6px}.brand-sub{font-size:10px;font-weight:800;letter-spacing:2px;color:#b9d1ef}.stats{display:flex;gap:9px}.pill{min-width:91px;padding:10px 14px;border:1px solid #ffffff2a;border-radius:15px;background:#0d1935c7;box-shadow:0 8px 22px #07152d35;backdrop-filter:blur(12px);font-size:13px;font-weight:900}.pill span{color:#ffcf57;font-size:16px;margin-right:5px}.level-card{position:fixed;top:88px;left:24px;padding:11px 15px;border-radius:13px;background:#0d1935c7;border:1px solid #ffffff21;backdrop-filter:blur(10px);font-weight:850;font-size:12px;color:#d7e8ff}.level-card b{color:#63d8ff}.progress{margin-top:7px;width:175px;height:5px;border-radius:8px;background:#ffffff24;overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,#4cbeff,#8cf3ff);border-radius:8px;transition:width .25s}.sound{position:fixed;top:max(18px,env(safe-area-inset-top));right:22px;transform:translateY(62px);width:39px;height:39px;background:#0d1935c7;border:1px solid #ffffff2a;border-radius:12px;cursor:pointer;font-size:17px}.hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:9px 14px;border-radius:11px;background:#0d193a9c;color:#c4d5ef;font-size:11px;font-weight:750;border:1px solid #ffffff16}.hint kbd{font-family:inherit;color:white;background:#ffffff19;border:1px solid #ffffff2c;border-radius:5px;padding:2px 6px;margin:0 2px}.toast{position:fixed;top:24%;left:50%;transform:translate(-50%,-12px);opacity:0;padding:12px 19px;border-radius:13px;background:#10254cdd;border:1px solid #7be8ff77;box-shadow:0 10px 40px #03102b55;font-weight:900;transition:.25s;pointer-events:none;z-index:4}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#10234c99,#081431bb);backdrop-filter:blur(8px);transition:opacity .35s,visibility .35s;z-index:5}.modal.hidden{opacity:0;visibility:hidden;pointer-events:none}.dialog{width:min(490px,calc(100vw - 32px));padding:34px 35px 29px;text-align:center;border-radius:27px;background:linear-gradient(150deg,#203d6ded,#111f43f2);border:1px solid #ffffff30;box-shadow:0 25px 100px #020a20a6}.eyebrow{letter-spacing:3px;font-size:10px;color:#82e6ff;font-weight:1000}.dialog h1{font-size:clamp(34px,8vw,52px);line-height:.98;letter-spacing:-2px;margin:14px 0 12px;font-weight:1000}.dialog h1 em{font-style:normal;color:#74e0ff}.dialog p{color:#c6d6ee;line-height:1.55;font-size:14px;margin:0 auto 23px;max-width:350px}.play{border:0;border-radius:13px;padding:14px 31px;background:linear-gradient(110deg,#83edff,#49aaff);box-shadow:0 8px 25px #3faaff44;color:#092047;font-weight:1000;font-size:15px;cursor:pointer}.under{margin-top:16px;color:#99b2d4;font-size:11px;font-weight:750}.avatar-preview{font-size:48px;display:block;margin:7px}.touch{display:none;position:fixed;inset:auto 0 max(20px,env(safe-area-inset-bottom));justify-content:space-between;align-items:end;padding:0 21px;pointer-events:none}.cluster{display:flex;gap:12px;pointer-events:auto}.touch button{width:63px;height:63px;border:1px solid #ffffff48;border-radius:19px;background:#10234fc4;box-shadow:0 8px 25px #06112e66;font-size:23px;font-weight:900;touch-action:none}.touch .jump{width:76px;height:76px;border-radius:50%;background:#32b9eecc;border-color:#a4f3ff;font-size:13px}.footer{position:fixed;right:24px;bottom:21px;color:#ffffff70;font-size:10px;font-weight:750;letter-spacing:1px;pointer-events:none}@media(max-width:650px){.topbar{left:14px;right:14px}.brand-mark{width:38px;height:38px;font-size:19px}.brand-name{font-size:15px}.brand-sub{font-size:8px}.pill{min-width:auto;padding:8px 10px;font-size:11px}.level-card{top:72px;left:14px}.progress{width:140px}.sound{right:14px;transform:translateY(53px);width:35px;height:35px}.hint{bottom:17px;font-size:10px}.touch{display:flex}.footer{display:none}.dialog{padding:28px 22px 23px}.dialog p{font-size:13px}}@media(max-height:500px) and (orientation:landscape){.touch button{width:53px;height:53px}.touch .jump{width:62px;height:62px}.dialog{padding:20px}.avatar-preview{display:none}}
</style></head><body><canvas id="game" aria-label="Blocktopia Skyway Obby game"></canvas><div class="topbar"><div class="brand"><div class="brand-mark">▧</div><div><div class="brand-name">BLOCKTOPIA</div><div class="brand-sub">SKYWAY OBBY</div></div></div><div class="stats"><div class="pill"><span>✦</span><b id="coinCount">0</b> / 16</div><div class="pill"><span>♥</span><b id="lifeCount">3</b></div></div></div><div class="level-card">WORLD 01 <b>·</b> SKY ISLANDS<div class="progress"><i id="progress"></i></div></div><button class="sound" id="sound" aria-label="Toggle sound">♫</button><div class="hint"><kbd>←</kbd><kbd>→</kbd> move &nbsp; <kbd>SPACE</kbd> jump &nbsp; <kbd>R</kbd> restart</div><div class="toast" id="toast"></div><div class="touch"><div class="cluster"><button data-key="left" aria-label="Move left">◀</button><button data-key="right" aria-label="Move right">▶</button></div><button class="jump" data-key="jump" aria-label="Jump">JUMP</button></div><div class="footer">A LITTLE JUMP GOES A LONG WAY ✦</div><div class="modal" id="modal"><div class="dialog"><div class="eyebrow">A blocky little adventure</div><span class="avatar-preview">🧢</span><h1 id="title">READY,<br><em>ROOKIE?</em></h1><p id="message">Run, leap, and collect stars across the clouds. Reach the glowing portal without taking a dip!</p><button class="play" id="play">LET'S PLAY&nbsp; →</button><div class="under">MOVE <b>← →</b> &nbsp;·&nbsp; JUMP <b>SPACE / ↑</b></div></div></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');const $=s=>document.querySelector(s),ui={coins:$('#coinCount'),lives:$('#lifeCount'),progress:$('#progress'),modal:$('#modal'),title:$('#title'),message:$('#message'),play:$('#play'),toast:$('#toast'),sound:$('#sound')};let W=innerWidth,H=innerHeight,DPR=1,cam=0,last=0,elapsed=0,toastTimer,started=false,over=false,muted=false;const worldW=3920;let platforms=[],coins=[],hazards=[],decor=[];const player={x:90,y:0,w:34,h:48,vx:0,vy:0,ground:false,face:1,invuln:0,checkpoint:90,anim:0},keys={left:false,right:false};let coinTotal=0,lives=3,audio;
function buildWorld(){let gy=H*.75;platforms=[[-200,gy,520,'start'],[390,gy-72,148],[610,gy-142,134],[817,gy-80,153],[1033,gy-160,126],[1230,gy-91,181,'check'],[1488,gy-161,130],[1690,gy-79,148],[1910,gy-143,148],[2130,gy-67,199,'check'],[2400,gy-149,130],[2600,gy-215,132],[2810,gy-124,170],[3050,gy-187,143],[3260,gy-91,193,'check'],[3525,gy-162,198,'finish']].map(([x,y,w,type])=>({x,y,w,h:22,type}));coins=[];[[235,gy-92],[447,gy-122],[655,gy-193],[870,gy-131],[1075,gy-211],[1295,gy-142],[1530,gy-212],[1740,gy-130],[1957,gy-194],[2207,gy-118],[2442,gy-201],[2662,gy-267],[2865,gy-176],[3104,gy-239],[3330,gy-143],[3618,gy-214]].forEach(([x,y],i)=>coins.push({x,y,r:10,got:false,phase:i*.7}));hazards=[{x:925,y:gy-98,w:30,h:18,base:925,range:28,phase:0},{x:1790,y:gy-97,w:30,h:18,base:1790,range:32,phase:1.4},{x:2938,y:gy-142,w:30,h:18,base:2938,range:32,phase:2.4}];decor=[];for(let i=0;i<42;i++)decor.push({x:i*112+(i*37%61),y:gy-100-(i*71%190),r:17+i%28,speed:.08+i%4*.025,alpha:.12+i%4*.035});player.y=gy-player.h}
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);if(!platforms.length)buildWorld()}
function beep(freq=500,dur=.08){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}
function toast(t){ui.toast.textContent=t;ui.toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.classList.remove('show'),1500)}function begin(){started=true;over=false;ui.modal.classList.add('hidden');last=performance.now();requestAnimationFrame(loop);beep(660,.1)}function fresh(){reset();ui.title.innerHTML='READY,<br><em>ROOKIE?</em>';ui.message.textContent='Run, leap, and collect stars across the clouds. Reach the glowing portal without taking a dip!';ui.play.textContent="LET'S PLAY  →";begin()}ui.play.onclick=begin;ui.sound.onclick=()=>{muted=!muted;ui.sound.textContent=muted?'♫̸':'♫';ui.sound.style.opacity=muted?'.55':'1'};
function reset(){coinTotal=0;lives=3;player.x=90;player.y=platforms[0].y-player.h;player.vx=player.vy=0;player.checkpoint=90;player.invuln=0;coins.forEach(c=>c.got=false);ui.coins.textContent='0';ui.lives.textContent='3';ui.progress.style.width='0%';if(over){over=false;started=true;ui.modal.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}}function jump(){if(started&&!over&&player.ground){player.vy=-590;player.ground=false;beep(540,.07)}}function key(e,on){let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=on;if(k==='arrowright'||k==='d')keys.right=on;if([' ','arrowup','w'].includes(k)){if(on&&!e.repeat)jump()}if(on&&k==='r')reset();if(on&&[' ','arrowup','arrowleft','arrowright'].includes(k))e.preventDefault()}addEventListener('keydown',e=>key(e,true));addEventListener('keyup',e=>key(e,false));addEventListener('blur',()=>keys.left=keys.right=false);document.querySelectorAll('.touch button').forEach(b=>{let k=b.dataset.key,down=e=>{e.preventDefault();k==='jump'?jump():keys[k]=true},up=e=>{e.preventDefault();if(k!=='jump')keys[k]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
function lose(){if(player.invuln>0)return;lives--;ui.lives.textContent=lives;beep(170,.25);if(lives<=0){over=true;started=false;ui.title.innerHTML='OH NO,<br><em>YOU FELL!</em>';ui.message.textContent=`You collected ${coinTotal} stars. The sky islands aren't going anywhere—give it another go!`;ui.play.textContent='TRY AGAIN  ↻';ui.play.onclick=fresh;ui.modal.classList.remove('hidden');return}let cp=platforms.find(p=>p.type==='check'&&p.x<=player.checkpoint);player.x=player.checkpoint;player.y=cp?cp.y-player.h:platforms[0].y-player.h;player.vx=player.vy=0;player.invuln=1.5;toast('Checkpoint saved. Try again!')}
function win(){over=true;started=false;ui.title.innerHTML='YOU MADE<br><em>IT!</em>';ui.message.textContent=`Skyway conquered! You found ${coinTotal} of 16 stars. Ready for another run?`;ui.play.textContent='PLAY AGAIN  ↻';ui.play.onclick=fresh;ui.modal.classList.remove('hidden');beep(880,.3)}
function update(dt){elapsed+=dt;let ax=(keys.right?1:0)-(keys.left?1:0);player.vx+=ax*1900*dt;player.vx*=Math.pow(player.ground?.79:.985,dt*60);player.vx=Math.max(-260,Math.min(260,player.vx));if(ax)player.face=ax;player.vy=Math.min(900,player.vy+1450*dt);let oldY=player.y;player.x=Math.max(-50,Math.min(worldW-30,player.x+player.vx*dt));player.y+=player.vy*dt;player.ground=false;for(let p of platforms)if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldY+player.h<=p.y+6&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true;if(p.type==='check'&&player.checkpoint<p.x+20){player.checkpoint=p.x+12;toast('✦ Checkpoint reached!');beep(770,.15)}}player.anim+=dt*Math.abs(player.vx)*.045;player.invuln=Math.max(0,player.invuln-dt);hazards.forEach(h=>{h.x=h.base+Math.sin(elapsed*1.6+h.phase)*h.range;if(!player.invuln&&player.x+player.w>h.x&&player.x<h.x+h.w&&player.y+player.h>h.y&&player.y<h.y+h.h)lose()});coins.forEach(c=>{if(!c.got&&Math.abs(player.x+17-c.x)<25&&Math.abs(player.y+24-(c.y+Math.sin(elapsed*3+c.phase)*4))<29){c.got=true;ui.coins.textContent=++coinTotal;beep(700+coinTotal*25,.08);toast('Star collected! +1')}});if(player.y>H+170)lose();cam=Math.max(0,Math.min(worldW-W,player.x-W*.36));ui.progress.style.width=Math.min(100,player.x/(worldW-120)*100)+'%';if(player.x>3590&&player.y<platforms[15].y+20)win()}
function rr(x,y,w,h,r,color,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}function cloud(x,y,r){ctx.beginPath();ctx.arc(x,y,r*.58,0,7);ctx.arc(x+r*.48,y-r*.25,r*.65,0,7);ctx.arc(x+r,y,r*.48,0,7);ctx.arc(x+r*.48,y+r*.13,r*.62,0,7);ctx.fillStyle='#f8fdff';ctx.fill()}
function background(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5bb6e8');g.addColorStop(.52,'#a4d8ec');g.addColorStop(1,'#e1f1f0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);g=ctx.createRadialGradient(W*.76,H*.2,6,W*.76,H*.2,130);g.addColorStop(0,'#fff6d8dd');g.addColorStop(.25,'#fff1c977');g.addColorStop(1,'#fff1c900');ctx.fillStyle=g;ctx.fillRect(W*.76-140,H*.2-140,280,280);for(let l=0;l<3;l++){let base=H*(.51+l*.075),off=-(cam*(.10+l*.08))%310;ctx.fillStyle=['#86cce0','#acdce6','#d1e9e9'][l];ctx.beginPath();ctx.moveTo(0,H);for(let x=-330+off;x<W+350;x+=310){ctx.quadraticCurveTo(x+95,base-60-l*8,x+175,base);ctx.quadraticCurveTo(x+240,base+22,x+310,base-15)}ctx.lineTo(W,H);ctx.fill()}decor.forEach(c=>{let x=(c.x-cam*c.speed)%(W+200);if(x< -100)x+=W+200;ctx.globalAlpha=c.alpha;cloud(x,c.y,c.r)});ctx.globalAlpha=1}
function portal(x,y){let s=1+Math.sin(elapsed*4)*.06;ctx.save();ctx.translate(x,y-48);ctx.scale(s,s);ctx.shadowColor='#a795ff';ctx.shadowBlur=28;ctx.strokeStyle='#c9b8ff';ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(20,25,20,29,0,0,7);ctx.stroke();ctx.shadowBlur=10;ctx.strokeStyle='#80eaff';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(20,25,12,22,0,0,7);ctx.stroke();ctx.fillStyle='white';ctx.fillText('✦',13,31);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);background();platforms.forEach(p=>{let x=p.x-cam;if(x+p.w< -20||x>W+20)return;ctx.save();ctx.shadowColor='#224c7570';ctx.shadowBlur=15;ctx.shadowOffsetY=9;rr(x,p.y,p.w,p.h,7,p.type==='finish'?'#8265dc':p.type==='check'?'#4cbb9d':'#2984ad');ctx.shadowBlur=0;ctx.shadowOffsetY=0;rr(x,p.y,p.w,8,4,p.type==='finish'?'#b49aff':p.type==='check'?'#87e7c5':'#63d5e5');ctx.beginPath();ctx.moveTo(x+3,p.y+p.h);ctx.lineTo(x+p.w-3,p.y+p.h);ctx.lineTo(x+p.w-12,p.y+p.h+13);ctx.lineTo(x+p.w*.72,p.y+p.h+19);ctx.lineTo(x+p.w*.34,p.y+p.h+13);ctx.lineTo(x+11,p.y+p.h+18);ctx.fillStyle='#276a87';ctx.fill();if(p.type==='check'){ctx.fillStyle='white';ctx.fillText('✦',x+p.w/2,p.y-8)}if(p.type==='finish')portal(x+p.w-45,p.y);ctx.restore()});coins.forEach(c=>{if(c.got)return;let y=c.y+Math.sin(elapsed*3+c.phase)*4,x=c.x-cam;ctx.save();ctx.translate(x,y);ctx.shadowColor='#ffd54c';ctx.shadowBlur=14;ctx.fillStyle='#ffce4d';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff0a1';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff4bf';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✦',0,1);ctx.restore()});hazards.forEach(h=>{let x=h.x-cam;rr(x,h.y,h.w,h.h,5,'#fa6584','#ffd0d9');ctx.fillStyle='#653a70';ctx.beginPath();ctx.arc(x+9,h.y+8,2,0,7);ctx.arc(x+21,h.y+8,2,0,7);ctx.fill()});if(!(player.invuln>0&&Math.floor(elapsed*14)%2===0)){let x=player.x-cam,y=player.y;ctx.save();ctx.translate(x+17,y+24);if(player.face<0)ctx.scale(-1,1);ctx.fillStyle='#235b7860';ctx.beginPath();ctx.ellipse(0,27,17,5,0,0,7);ctx.fill();rr(-12,7,10,17,3,'#334c9b');rr(3,7,10,17,3,'#334c9b');rr(-14,20,14,7,3,'#f5f8ff');rr(1,20,14,7,3,'#f5f8ff');rr(-15,-8,30,22,6,'#29aee2');rr(-15,-8,30,5,3,'#70e1f3');rr(-20,-6,7,19,3,'#ffcb94');rr(13,-6,7,19,3,'#ffcb94');rr(-14,-27,28,24,7,'#ffd3a4');ctx.fillStyle='#493525';ctx.fillRect(-6,-17,3,3);ctx.fillRect(5,-17,3,3);rr(-15,-32,30,10,5,'#4056c7');ctx.fillStyle='#6b83ff';ctx.beginPath();ctx.ellipse(2,-22,13,3,0,0,7);ctx.fill();ctx.fillStyle='#ffdc64';ctx.fillRect(-3,-29,6,3);ctx.restore()}}
function loop(t){if(!started||over)return;let dt=Math.min(.035,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}function idle(){draw();if(!started)requestAnimationFrame(idle)}addEventListener('resize',()=>{resize();draw()});resize();player.y=platforms[0].y-player.h;draw();requestAnimationFrame(idle)})();
</script></body></html>
